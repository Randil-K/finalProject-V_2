# Local development profile, used by `mvnw spring-boot:run` (see spring-boot.run.profiles in pom.xml).
# Same H2 database as the default profile, but kept in a file so accounts, reports and uploads
# survive a restart. Delete backend/data/ to start again from the demo data.
spring:
  datasource:
    url: jdbc:h2:file:${H2_FILE:./data/tideline};AUTO_SERVER=TRUE
  jpa:
    hibernate:
      ddl-auto: update
