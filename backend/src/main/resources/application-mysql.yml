# Production profile. Every value comes from the environment — see .env.example.
# A host that supplies a full JDBC URL can set SPRING_DATASOURCE_URL instead of the DB_* values.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tideline}?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: false
      hibernate.dialect: lk.tideline.cleanup.config.dialect.TidelineMySQLDialect

  h2:
    console:
      enabled: false

tideline:
  security:
    # Empty fallback on purpose: JwtService refuses to start unless a real secret (32+ characters) is set.
    jwt-secret: ${TIDELINE_JWT_SECRET:}
  # Seeding only runs against an empty database, so it is safe to leave on for a demo deployment.
  seed-demo-data: ${SEED_DEMO_DATA:false}

logging:
  level:
    lk.tideline.cleanup: INFO
