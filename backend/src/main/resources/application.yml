spring:
  application:
    name: cleanup-backend

  # The system's database is MySQL. XAMPP installs MariaDB under that name; both speak the same
  # protocol, so only the dialect differs — see DB_DIALECT below and application-local.yml.
  # The `mysql` profile (application-mysql.yml) adds what a hosted deployment needs on top.
  # The test suite overrides all of this with in-memory H2 (src/test/resources/application.properties),
  # and the `h2` profile runs the app itself without a database server.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tideline}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true
      # Enums are stored as text without CHECK lists, so new statuses don't break a saved database.
      # TidelineMariaDBDialect for MariaDB (XAMPP), TidelineMySQLDialect for an Oracle MySQL server.
      hibernate.dialect: ${DB_DIALECT:lk.tideline.cleanup.config.dialect.TidelineMariaDBDialect}

  h2:
    console:
      enabled: false

  # Password reset emails. Spring only builds a mail sender once spring.mail.host is set, which is
  # why the host is left to the environment: with SPRING_MAIL_HOST unset the link is written to the
  # server log instead, and the flow still works for a demo.
  #
  # Gmail, with an App Password (Google Account -> Security -> 2-Step Verification -> App passwords):
  #   SPRING_MAIL_HOST=smtp.gmail.com
  #   SPRING_MAIL_USERNAME=you@gmail.com
  #   SPRING_MAIL_PASSWORD=<the 16-character app password, no spaces>
  # Gmail only lets an account send as itself, so the From address follows the username unless
  # MAIL_FROM names an address that provider allows.
  mail:
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${SPRING_MAIL_STARTTLS:true}
      # A mail server that will not answer must not hold up the request.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jackson:
    default-property-inclusion: non_null

  # Divers attach up to five certificates of 5 MB each when they register.
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 80MB

server:
  # Hosts such as Render and Railway inject PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # /actuator/health/readiness only turns UP once startup work, including demo seeding, is done.
      probes:
        enabled: true

tideline:
  # A report passes community verification with at least 5 confirmations and 75% trust.
  verification:
    threshold-percent: 75
    minimum-confirmations: 5
  # New reports alert available users within this distance.
  alerts:
    initial-radius-km: 5
    # Once a government officer sets what a cleanup needs, people within this far are asked to help.
    recruitment-radius-km: 15
    # Still short a week later, the call goes out this far — skipping everyone already asked.
    widened-radius-km: 25
    widen-after-days: 7
    widen-scan-minutes: 15
  security:
    jwt-secret: ${TIDELINE_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
    jwt-expiry-minutes: 720
    remember-me-days: 30
  # Links in emails point here. Password reset emails need spring.mail.host (SPRING_MAIL_HOST) to be set;
  # without it the reset link is written to the server log.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:Tideline <no-reply@tideline.lk>}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  uploads:
    directory: ${UPLOADS_DIR:uploads}
  seed-demo-data: true

logging:
  level:
    lk.tideline.cleanup: DEBUG
