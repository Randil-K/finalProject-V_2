# The suite runs against in-memory H2 so it needs no database server and finishes in seconds.
# Everything else — ports, JWT, alert radii — still comes from the main application.yml; only the
# database is swapped out here.
#
# To run the same tests against the real thing instead:  mvnw test -Dspring.profiles.active=mysqltest
spring.datasource.url=jdbc:h2:mem:tideline;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=lk.tideline.cleanup.config.dialect.TidelineH2Dialect
spring.jpa.properties.hibernate.format_sql=false
