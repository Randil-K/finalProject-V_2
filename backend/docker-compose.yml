# Production-like local run: the real image against MySQL.
#   docker compose up --build
# API on http://localhost:8081 (8081 so it does not clash with the dev server on 8080).
# The credentials below are local-only values for this compose stack, not production secrets.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tideline
      MYSQL_USER: tideline
      MYSQL_PASSWORD: tideline-local
      MYSQL_ROOT_PASSWORD: root-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utideline", "-ptideline-local"]
      interval: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USERNAME: tideline
      DB_PASSWORD: tideline-local
      TIDELINE_JWT_SECRET: local-compose-only-secret-not-for-production-0123456789
      SEED_DEMO_DATA: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8081:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads:
